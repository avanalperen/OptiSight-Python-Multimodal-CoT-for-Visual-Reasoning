<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiSight Dashboard</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }

        .container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .left-panel,
        .right-panel {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .left-panel {
            border-right: 1px solid #333;
            background-color: #252526;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
            /* Full width content */
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        .right-panel {
            background-color: #1e1e1e;
            padding: 20px;
            /* Restore padding for right panel */
        }

        /* Header Row (Mode + Browse) */
        .header-row {
            /* header-row collapsed as controls are absolute */
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .resource-stats {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            color: #d4d4d4;
            pointer-events: none;
            margin-right: 20px;
            /* Space from other action zone elements */
            padding-left: 20px;
            /* Align to left edge of action zone */
        }

        .mode-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
            align-items: center;
            height: 50px;
            /* Fixed height */
        }

        button.mode-btn {
            padding: 12px 25px;
            background-color: #333;
            color: #ddd;
            border: 1px solid #555;
            cursor: pointer;
            font-size: 16px;
            /* Larger font */
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.2s;
            min-width: 120px;
            /* Fixed minimum width */
            white-space: nowrap;
            /* Prevent text wrapping inside button */
        }

        button.mode-btn:hover {
            background-color: #444;
            color: white;
        }

        button.mode-btn.active {
            background-color: #007acc;
            border-color: #569cd6;
            color: white;
        }

        .file-upload-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            height: 50px;
            /* Fixed height */
        }

        button.browse-btn {
            padding: 10px 22px;
            /* Larger */
            background-color: white;
            color: black;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 15px;
            /* Larger font */
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s;
            min-width: 140px;
            /* Fixed minimum width */
            white-space: nowrap;
            /* Prevent text wrapping inside button */
        }

        button.browse-btn:hover {
            background-color: #f0f0f0;
        }

        .file-info {
            display: none;
            /* Hide file info text to prevent expansion */
        }

        /* Action Zone (Horizontal beneath video) */
        .action-zone {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 5px;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            border-radius: 0;
            border-top: 1px solid #444;
            margin-top: auto;
            margin-bottom: 0;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .device-toggle {
            display: flex;
            background: #252526;
            padding: 3px;
            border-radius: 6px;
            border: 1px solid #555;
            width: 110px;
        }

        .device-toggle button {
            flex: 1;
            padding: 6px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .device-toggle button.active {
            background: #007acc;
            color: white;
        }

        #action-btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.1s;
            min-width: 160px;
        }

        #action-btn:active {
            transform: scale(0.98);
        }

        .capture-rate-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }

        .capture-rate-container label {
            font-size: 14px;
            color: #aaa;
            white-space: nowrap;
        }

        #fps-slider {
            width: 120px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            outline: none;
        }

        /* Resource Stats (removed container) */
        .resource-stats .stat-item {
            display: flex;
            gap: 8px;
            white-space: nowrap;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            gap: 25px;
        }

        .stat-label {
            color: #9cdcfe;
            font-weight: bold;
        }

        .stat-value {
            color: #4ec9b0;
            font-weight: 800;
        }

        /* Deleted duplicate browse-btn styles to prevent conflict */

        button.browse-btn:hover {
            background-color: #005a9e;
        }

        .file-info {
            margin-top: 0;
            color: #dcdcaa;
            font-size: 12px;
            font-family: 'Consolas', monospace;
            word-break: break-all;
            text-align: left;
        }

        input[type="file"] {
            display: none;
        }

        /* Video Container & Overlay Button */
        .video-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: hidden;
            position: relative;
            border: none;
            border-top: 1px solid #444;
            margin: 0;
            margin-top: 80px;
            /* Push down below the top controls */
        }

        video,
        img#captured-photo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Overlay Button */
        .overlay-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: rgba(0, 122, 204, 0.8);
            color: white;
            border: 2px solid white;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: background-color 0.2s;
            display: none;
        }

        .overlay-btn:hover {
            background-color: rgba(0, 122, 204, 1);
        }

        .fps-control {
            margin-top: 20px;
            width: 80%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex-grow: 1;
        }

        /* Right Panel Sections */
        .section {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .section label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #9cdcfe;
            font-size: 20px;
            /* Increased */
        }

        textarea {
            background-color: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 15px;
            resize: vertical;
            min-height: 120px;
            /* Increased */
            font-family: 'Consolas', monospace;
            font-size: 18px;
            /* Increased */
            display: block;
            /* Always visible */
            opacity: 0.5;
            /* Dimmed by default */
            transition: opacity 0.3s;
        }

        textarea.active {
            opacity: 1;
            background-color: #444;
            /* Slightly lighter/brighter */
        }

        .result-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #result-display {
            flex-grow: 1;
            background-color: #2d2d2d;
            border: 1px solid #444;
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Consolas', monospace;
            color: #ce9178;
            font-size: 18px;
            /* Increased */
            line-height: 1.5;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            /* Moved below textarea */
            font-size: 18px;
            /* Increased */
            padding: 10px;
        }

        .checkbox-container input {
            width: 22px;
            /* Increased */
            height: 22px;
        }

        #btn-save-prompt,
        #btn-save-result {
            padding: 8px 20px;
            font-size: 16px;
            background: #007acc;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        #btn-save-prompt:hover,
        #btn-save-result:hover {
            background: #005a9e;
        }

        #btn-clear-result {
            padding: 8px 20px;
            font-size: 16px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        #btn-clear-result:hover {
            background: #e0e0e0;
        }

        .btn-dimmed {
            opacity: 0.35;
            pointer-events: none;
            cursor: default;
        }

        /* Habitat Mode Selection Overlay */
        .habitat-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            /* Dark background */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 50;
            display: none;
            /* Hidden by default */
        }

        .habitat-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            width: 300px;
            text-align: center;
            transition: all 0.2s;
        }

        .habitat-btn:hover {
            background-color: #444;
            border-color: #007acc;
            transform: scale(1.02);
        }

        .habitat-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #222;
            border-color: #333;
        }

        /* Route Drawing Canvas */
        #route-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            /* Above video, below overlay */
            cursor: crosshair;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="header-row">
                <div class="mode-controls">
                    <button id="btn-photo" class="mode-btn" onclick="setMode('photo')">Photo</button>
                    <button id="btn-video" class="mode-btn" onclick="setMode('video')">Video</button>
                    <button id="btn-habitat" class="mode-btn" onclick="setMode('habitat')">AI Habitat Sim</button>

                    <div class="file-upload-controls">
                        <div id="photo-browse-area" style="display:flex; align-items:center; gap: 10px;">
                            <button class="browse-btn" onclick="document.getElementById('photo-upload').click()">Browse
                                Photo</button>
                            <div id="photo-info" class="file-info" style="display:none;"></div>
                        </div>

                        <div id="video-browse-area" style="display:none; align-items:center; gap: 10px;">
                            <button class="browse-btn" onclick="document.getElementById('video-upload').click()">Browse
                                Video</button>
                            <div id="video-info" class="file-info" style="display:none;"></div>
                        </div>

                        <div id="sim-browse-area" style="display:none; align-items:center; gap: 10px;">
                            <button class="browse-btn" onclick="selectSim()">Browse Sim</button>
                            <div id="sim-info" class="file-info" style="display:none;"></div>
                        </div>

                        <input type="file" id="photo-upload" accept="image/*"
                            onchange="handleFileSelect(this, 'image')">
                        <input type="file" id="video-upload" accept="video/*"
                            onchange="handleFileSelect(this, 'video')">
                        <input type="file" id="sim-upload" accept=".glb,.json" onchange="handleFileSelect(this, 'sim')">
                    </div>
                </div>
            </div>

            <div class="video-container">
                <video id="video-feed" controls playsinline style="display:none;"></video>
                <img id="captured-photo" style="display:none;" />
                <canvas id="canvas" style="display:none;"></canvas> <!-- Original canvas for photo capture? -->
                <canvas id="route-canvas"></canvas> <!-- New canvas for route drawing -->
                <div id="collision-counter"
                    style="display:none; position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.7); color:white; padding:5px 10px; border-radius:5px; z-index:50; font-family:monospace; font-size:16px; border:1px solid #f44747;">
                    Collisions: 0</div>

                <div id="habitat-selection-overlay" class="habitat-overlay">
                    <h2 style="color: white; margin-bottom: 20px;">Select Habitat Mode</h2>
                    <button class="habitat-btn disabled" disabled>Record Route Video (Soon)</button>
                    <button class="habitat-btn" onclick="selectHabitatMode('live')">Live Control</button>
                    <button class="habitat-btn disabled" disabled>Autonomous VLM (Soon)</button>
                    <button id="cancel-habitat-overlay"
                        style="margin-top:20px; background:transparent; border:none; color:#aaa; cursor:pointer;"
                        onclick="document.getElementById('habitat-selection-overlay').style.display='none'">Cancel</button>
                </div>

                <div id="scene-selection-overlay" class="habitat-overlay">
                    <h2 style="color: white; margin-bottom: 20px;">Select a Habitat Scene</h2>
                    <div id="scene-list"
                        style="display:flex; flex-direction:column; gap:10px; max-height: 300px; overflow-y:auto; width: 100%; align-items: center;">
                        <!-- Scenes will be populated here -->
                    </div>
                    <button style="margin-top:20px; background:transparent; border:none; color:#aaa; cursor:pointer;"
                        onclick="document.getElementById('scene-selection-overlay').style.display='none'">Cancel</button>
                </div>

                <div id="map-selection-overlay" class="habitat-overlay">
                    <h2 style="color: white; margin-bottom: 20px;">Select Starting Position</h2>
                    <div style="position: relative; border: 2px solid #555;">
                        <img id="topdown-map-img" style="max-width: 600px; max-height: 400px; cursor: crosshair;"
                            onclick="handleMapClick(event)">
                        <!-- Marker for click confirmation -->
                        <div id="spawn-marker"
                            style="position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; display: none; transform: translate(-50%, -50%); pointer-events: none;">
                        </div>
                    </div>
                    <p style="color: #aaa; margin-top: 10px;">Click on a white area to spawn there.</p>
                    <button id="spawn-starter-btn"
                        style="margin-top:10px; padding:10px 20px; font-weight:bold; cursor:pointer; background-color:#333; color:white; border:2px solid #555; border-radius:5px;"
                        onclick="spawnStarter()">Spawn from Starter Point</button>
                    <button id="cancel-map-overlay"
                        style="margin-top:20px; background:transparent; border:none; color:#aaa; cursor:pointer;"
                        onclick="closeMapOverlay()">Cancel (Use Default)</button>
                </div>

                <div id="model-selection-overlay" class="habitat-overlay">
                    <h2 style="color: white; margin-bottom: 20px;">Select Vision Model</h2>
                    <button class="habitat-btn" onclick="selectModel('qwen2-2b')">Qwen 2B</button>
                    <button class="habitat-btn" onclick="selectModel('deepseek-1.3b')">DeepSeek 1.3B</button>
                    <button style="margin-top:20px; background:transparent; border:none; color:#aaa; cursor:pointer;"
                        onclick="document.getElementById('model-selection-overlay').style.display='none'">Cancel</button>
                </div>

                <div id="placeholder-text" style="color: #666;">Select a Source</div>
            </div>

            <div class="action-zone">
                <div class="resource-stats">
                    <div class="stat-item">
                        <span class="stat-label">RAM Usage:</span>
                        <span id="ram-val" class="stat-value">--%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">GPU Utilization:</span>
                        <span id="gpu-val" class="stat-value">--%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" style="font-size: 12px;">GPU Memory (VRAM):</span>
                        <span id="gpu-mem" style="font-size: 12px; color: #ce9178; font-weight: bold;">--</span>
                    </div>
                </div>

                <div class="action-row">
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div class="device-toggle" style="width: 120px;">
                            <button id="device-cpu" onclick="setDevice('cpu')">CPU</button>
                            <button id="device-gpu" class="active" onclick="setDevice('cuda')">GPU</button>
                        </div>
                        <button id="load-model-btn" onclick="toggleLoadModel()"
                            style="padding: 6px 10px; font-size: 11px; background: #444; color: #ccc; border: 1px solid #666; cursor: pointer; border-radius: 4px; font-weight: bold; width: 120px;">Choose
                            Model</button>
                    </div>

                    <div class="capture-rate-container" id="fps-control" style="display: none;">
                        <label>Every: <span id="fps-val">3</span>s</label>
                        <input type="range" id="fps-slider" min="3" max="7" step="2" value="3"
                            oninput="updateFPS(this.value)">
                    </div>

                    <button id="action-btn" onclick="handleAction()" style="display: none;"></button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="section">
                <label>Prompt Settings</label>
                <textarea id="prompt-input" disabled>Describe this image</textarea>
                <div class="checkbox-container">
                    <input type="checkbox" id="use-custom-prompt" onchange="togglePromptInput()">
                    <label for="use-custom-prompt" style="flex-grow:1;">Use Custom Prompt</label>
                    <button id="btn-save-prompt" onclick="savePrompt()">Save Prompt</button>
                </div>
            </div>

            <div class="result-section" style="margin-top: 0;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                    <label style="margin-bottom: 0;">Analysis Result</label>
                </div>
                <div id="result-display">Waiting for input...</div>
                <div style="display:flex; justify-content:flex-end; gap: 10px; margin-top: 10px;">
                    <button id="btn-clear-result" onclick="clearResult()">Clear</button>
                    <button id="btn-save-result" onclick="saveCurrentResult()">Save Result</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('canvas');
        const photoDisplay = document.getElementById('captured-photo');
        const resultDisplay = document.getElementById('result-display');
        const fpsLabel = document.getElementById('fps-val');
        const actionBtn = document.getElementById('action-btn');
        const promptInput = document.getElementById('prompt-input');
        const placeholder = document.getElementById('placeholder-text');

        // Resource Monitor elements
        const ramVal = document.getElementById('ram-val');
        const gpuVal = document.getElementById('gpu-val');
        const gpuMem = document.getElementById('gpu-mem');

        // Periodic Stats Polling
        async function updateStats() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                ramVal.textContent = data.ram + '%';
                gpuVal.textContent = data.gpu.percent + '%';
                gpuMem.textContent = data.gpu.usage;

                // Color coding RAM
                if (data.ram > 90) ramVal.style.color = '#f44747';
                else if (data.ram > 70) ramVal.style.color = '#dcdcaa';
                else ramVal.style.color = '#4ec9b0';
            } catch (e) { }
        }
        setInterval(updateStats, 2000);
        updateStats();

        // File inputs
        const photoUpload = document.getElementById('photo-upload');
        const videoUpload = document.getElementById('video-upload');

        let currentMode = null;
        let streamTimeout = null;
        let lastAnalysisTimestamp = 0;
        let remainingTimeAtPause = 0;
        let captureIntervalSec = 3;
        let currentSourceName = '';
        let isStreaming = false;
        let selectedDevice = 'cuda';
        let isModelLoaded = false;
        let selectedModel = null; // Store chosen model

        let currentAnalysisController = null; // Controller for cancelling pending requests

        const BASE_PROMPT = "Describe this image";

        function setDevice(device) {
            if (device === 'cpu' && selectedDevice !== 'cpu') {
                const confirmMessage = "Do you want to continue?\n\nWARNING : IT CAN COLLAPSE YOUR SYSTEM";
                if (!confirm(confirmMessage)) {
                    return; // Stays on current device
                }
            }
            selectedDevice = device;
            document.getElementById('device-cpu').classList.toggle('active', device === 'cpu');
            document.getElementById('device-gpu').classList.toggle('active', device === 'cuda');
            console.log("Device selected:", device);

            // If device changes and model was loaded, it will be reloaded on next analysis or manual load
            // For simplicity, we just reset the button state
            resetLoadButton();
        }

        function resetLoadButton() {
            const btn = document.getElementById('load-model-btn');
            btn.textContent = "Choose Model";
            btn.style.background = "#444";
            btn.style.color = "#ccc";
            btn.disabled = false;
            isModelLoaded = false;
            selectedModel = null;
        }

        async function toggleLoadModel() {
            const btn = document.getElementById('load-model-btn');

            if (!isModelLoaded) {
                if (!selectedModel) {
                    // First time: Show model selection modal
                    document.getElementById('model-selection-overlay').style.display = 'flex';
                    return;
                }

                // LOAD Path
                btn.disabled = true;
                btn.textContent = "Loading...";

                const formData = new FormData();
                formData.append('device_choice', selectedDevice);
                formData.append('model_choice', selectedModel);

                try {
                    const res = await fetch('/load_model', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        btn.textContent = "Unload Model";
                        btn.style.background = "#007acc";
                        btn.style.color = "white";
                        btn.disabled = false;
                        isModelLoaded = true;

                        // Debug selected model and loading time to Analysis Result screen
                        if (typeof logDebug === 'function') {
                            logDebug(`Model Loaded: ${data.message}`);
                        }

                        // Wait a moment then fetch stats so GPU memory updates correctly
                        setTimeout(updateStats, 1500);
                    } else {
                        btn.textContent = "Retry Load";
                        btn.disabled = false;
                    }
                } catch (e) {
                    btn.textContent = "Error";
                    btn.disabled = false;
                }
            } else {
                // UNLOAD Path
                btn.disabled = true;
                btn.textContent = "Unloading...";

                try {
                    const res = await fetch('/unload_model', { method: 'POST' });
                    const data = await res.json();
                    resetLoadButton();

                    if (typeof logDebug === 'function') {
                        logDebug(data.message || "Model unloaded.");
                    }

                    // Run updateStats after a short delay since unloading takes a moment on CUDA
                    setTimeout(updateStats, 1500);
                } catch (e) {
                    btn.textContent = "Error Unload";
                    btn.disabled = false;
                }
            }
        }

        function selectModel(modelName) {
            selectedModel = modelName;
            document.getElementById('model-selection-overlay').style.display = 'none';
            // Trigger the actual load
            toggleLoadModel();
        }

        function cancelCurrentAnalysis() {
            if (currentAnalysisController) {
                currentAnalysisController.abort();
                currentAnalysisController = null;
                console.log("Previous analysis cancelled.");
            }
        }

        function setMode(mode) {
            cancelCurrentAnalysis(); // Cancel any pending operations
            currentMode = mode;
            currentSourceName = ''; // Reset source name
            console.log("Mode clicked:", mode);

            // UI Updates
            document.querySelectorAll('.mode-controls button').forEach(b => b.classList.remove('active'));

            if (currentMode === 'habitat' && !isStreaming) {

                const key = e.key; // Use case-sensitive but check lower for standard keys
                const keyLower = key.toLowerCase();

                if (keyLower === 'w') action = 'move_forward';
                else if (keyLower === 's') action = 'move_backward';
                else if (keyLower === 'a') action = 'turn_left';
                else if (keyLower === 'd') action = 'turn_right';
                else if (keyLower === 'q') action = 'look_up';
                else if (keyLower === 'z') action = 'look_down';
                else if (key === 'ArrowUp') action = 'look_up';
                else if (key === 'ArrowDown') action = 'look_down';
                else if (key === 'ArrowLeft') action = 'turn_left';
                else if (key === 'ArrowRight') action = 'turn_right';
                else if (keyLower === 'e') {
                    console.log("Interact triggered");
                    triggerInteract();
                    return;
                }
                else if (key === '0') {
                    console.log("Reset Camera triggered");
                    resetCamera();
                    return;
                }
                else if (keyLower === 'f') {
                    console.log("Snap to Floor triggered");
                    snapToFloor();
                    return;
                }
                else if (key === 'Escape') {
                    console.log("Exiting Live Control");
                    exitLiveControl();
                    return;
                }

                if (action) {
                    sendMoveCommand(action);
                }
            }

        async function analyzeSimSnapshot() {
            if (currentMode !== 'habitat') return;

            // PhotoDisplay holds the current base64 frame from simulator
            const base64Data = photoDisplay.src.split(',')[1];
            if (!base64Data) {
                logDebug(`<span style="color:#f44747">Error: No frame to analyze.</span>`);
                return;
            }

            // Convert base64 to Blob
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'image/jpeg' });

            logDebug("Capturing simulator snapshot for analysis...");

            // Send to backend asynchronously without awaiting so UI doesn't freeze
            sendFileToBackend(blob).catch(e => {
                console.error("Async analysis error:", e);
                logDebug(`<span style="color:#f44747">Async Error: ${e}</span>`);
            });
        }



        function togglePromptInput() {
            const isCustom = document.getElementById('use-custom-prompt').checked;
            if (isCustom) {
                promptInput.disabled = false;
                promptInput.classList.add('active');
                if (!promptInput.value || promptInput.value === BASE_PROMPT) {
                    promptInput.focus();
                }
            } else {
                promptInput.disabled = true;
                promptInput.classList.remove('active');
                promptInput.value = BASE_PROMPT; // Always revert to base
            }
            updateButtonStates();
        }

        async function savePrompt() {
            const content = promptInput.value;
            const name = prompt("Enter a name for this prompt (will be saved in /prompts):");
            if (name) {
                const formData = new FormData();
                formData.append('name', name);
                formData.append('content', content);

                try {
                    const res = await fetch('/save_prompt', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    alert(data.message);
                } catch (e) {
                    alert("Error saving prompt: " + e);
                }
            }
        }

        function updateFPS(val) {
            captureIntervalSec = val;
            fpsLabel.textContent = val;
            if (isStreaming) {
                stopStream();
                startStream();
            }
        }

        function captureFrameFromVideo() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
        }

        function getCurrentPrompt() {
            const isCustom = document.getElementById('use-custom-prompt').checked;
            if (isCustom) {
                return promptInput.value;
            } else {
                return BASE_PROMPT;
            }
        }

        function logDebug(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `<div style="margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px;"><span style="color:#569cd6">[${timestamp}]</span> <span style="color:#4ec9b0">DEBUG:</span> ${message}</div>`;
            resultDisplay.insertAdjacentHTML('beforeend', logEntry); // Append
            resultDisplay.scrollTop = resultDisplay.scrollHeight;
        }

        let lastResult = null;
        let lastPrompt = null;
        let lastMetadata = null;
        let lastDebugLog = '';

        function clearResult() {
            if (!confirm("Are you sure you want to clear the results?")) return;
            resultDisplay.innerHTML = 'Waiting for input...';
            lastResult = null;
            lastPrompt = null;
            lastMetadata = null;
            lastDebugLog = '';
            updateButtonStates();
        }

        function updateButtonStates() {
            const resultEmpty = resultDisplay.textContent.trim() === 'Waiting for input...' || resultDisplay.textContent.trim() === '';
            const promptEmpty = !promptInput.value || promptInput.value.trim() === '';

            // Clear button
            const clearBtn = document.getElementById('btn-clear-result');
            clearBtn.classList.remove('btn-dimmed');

            // Save Result button
            const saveResultBtn = document.getElementById('btn-save-result');
            if (resultEmpty) {
                saveResultBtn.classList.add('btn-dimmed');
            } else {
                saveResultBtn.classList.remove('btn-dimmed');
            }

            // Save Prompt button
            const savePromptBtn = document.getElementById('btn-save-prompt');
            if (promptEmpty) {
                savePromptBtn.classList.add('btn-dimmed');
            } else {
                savePromptBtn.classList.remove('btn-dimmed');
            }
        }

        async function saveCurrentResult() {
            if (!lastResult) return;
            const name = prompt("Enter a name for this result (will be saved in /results):");
            if (!name) return;
            const formData = new FormData();
            formData.append('name', name);
            formData.append('prompt', lastPrompt);
            formData.append('content', lastResult);
            formData.append('metadata', JSON.stringify(lastMetadata));
            formData.append('debug_log', lastDebugLog);
            formData.append('source_type', currentMode);
            formData.append('source_name', currentSourceName || 'Unknown');

            try {
                const res = await fetch('/save_result', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                alert(data.message);
            } catch (e) {
                alert("Error saving result: " + e);
            }
        }

        async function sendFileToBackend(fileBlob) {
            if (!fileBlob) return;

            const formData = new FormData();
            formData.append('file', fileBlob, 'image.jpg');
            formData.append('prompt', getCurrentPrompt());
            formData.append('device_choice', selectedDevice);
            if (selectedModel) {
                formData.append('model_choice', selectedModel);
            }

            logDebug(`Starting analysis [Device: ${selectedDevice}]...`);

            // Check if there's an existing controller (e.g. from same mode double-click? though buttons usually disabled/hidden or logic prevents. But safe to replace). 
            // Actually user logic said "tab switch". But cancelling previous on new start is also good practice.
            if (currentAnalysisController) currentAnalysisController.abort();
            currentAnalysisController = new AbortController();
            const signal = currentAnalysisController.signal;

            try {
                const startTime = Date.now();
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData,
                    signal: signal
                });
                const data = await response.json();
                const totalDuration = ((Date.now() - startTime) / 1000).toFixed(2);

                if (data.response.startsWith("Error")) {
                    logDebug(`<span style="color:#f44747">FAILED: ${data.response}</span>`);
                } else {
                    const loadTime = data.debug?.load_time || "0s";
                    const infTime = data.debug?.inference_time || "0s";

                    logDebug(`<span style="color:#dcdcaa">SUCCESS: Total ${totalDuration}s (Load: ${loadTime}, Inf: ${infTime})</span>`);

                    lastResult = data.response;
                    lastPrompt = getCurrentPrompt();
                    lastMetadata = data.debug;
                    lastDebugLog = resultDisplay.innerText;
                    updateButtonStates();

                    const timestamp = new Date().toLocaleTimeString();
                    const finalResult = `
                        <div style="background: #333; padding: 20px; border-left: 6px solid #007acc; margin: 15px 0;">
                            <div style="color:#569cd6; font-weight:bold; font-size: 20px; margin-bottom:10px;">[${timestamp}] RESULT:</div>
                            <div style="margin-bottom:15px; font-size: 19px; line-height: 1.6;">${data.response}</div>
                            <div style="border-top: 1px solid #555; padding-top: 12px; font-size: 16px; font-family: 'Consolas', monospace; color: #aaa;">
                                <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                                    <span style="color: #4ec9b0; font-weight: bold;">Model: ${data.debug?.model_choice || 'Unknown'} | Device: ${data.debug?.device || 'Unknown'}</span>
                                    <span>Load: <span style="color:white;">${loadTime}</span> | Inf: <span style="color:white;">${infTime}</span></span>
                                </div>
                                <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                                    <span>Total Time: <span style="color:white;">${data.debug?.total_time}</span></span>
                                </div>
                                <div style="display:flex; justify-content:space-between;">
                                    <span>RAM: <span style="color:white;">${data.debug?.ram_usage}</span></span>
                                    <span>GPU: <span style="color:white;">${data.debug?.gpu_usage}</span></span>
                                </div>
                            </div>
                        </div>
                    `;
                    resultDisplay.insertAdjacentHTML('beforeend', finalResult); // Append

                    // Also show debug timing at the very bottom for easy visibility
                    const debugSummary = `<div style="margin-top: 5px; padding: 5px 10px; background: #1e1e1e; border-left: 3px solid #4ec9b0; font-family: 'Consolas', monospace; font-size: 14px; color: #888;">DEBUG: SUCCESS: Total ${totalDuration}s (Load: ${loadTime}, Inf: ${infTime})</div>`;
                    resultDisplay.insertAdjacentHTML('beforeend', debugSummary);
                    resultDisplay.scrollTop = resultDisplay.scrollHeight;
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log("Fetch aborted by user navigation or new request.");
                    // Do not log error to UI
                } else {
                    console.error("Error:", error);
                    logDebug(`<span style="color:#f44747">ERROR: Communication problem.</span>`);
                }
            } finally {
                currentAnalysisController = null;
            }
        }

        async function analyzePhoto() {
            if (photoUpload.files && photoUpload.files[0]) {
                await sendFileToBackend(photoUpload.files[0]);
            }
        }

        function toggleStream() {
            if (isStreaming) {
                stopStream();
            } else {
                startStream();
            }
            updateActionButton();
        }

        function startStream() {
            isStreaming = true;
            if (video.paused && currentMode === 'video') video.play();

            console.log(`Starting stream analysis...`);
            remainingTimeAtPause = 0;
            scheduleNextAnalysis(0);
        }

        function stopStream() {
            isStreaming = false;
            cancelCurrentAnalysis(); // For total stop, we do cancel pending
            if (streamTimeout) {
                clearTimeout(streamTimeout);
                streamTimeout = null;
            }
            if (currentMode === 'video') video.pause();
        }

        function scheduleNextAnalysis(delay) {
            if (streamTimeout) clearTimeout(streamTimeout);
            streamTimeout = setTimeout(triggerAnalysisStep, delay);
        }

        async function triggerAnalysisStep() {
            if (!isStreaming) return;
            if (currentMode === 'video' && video.paused) return;

            lastAnalysisTimestamp = Date.now();
            const blob = await captureFrameFromVideo();
            await sendFileToBackend(blob);

            // Schedule next if still active and not paused
            if (isStreaming && (currentMode !== 'video' || !video.paused)) {
                scheduleNextAnalysis(captureIntervalSec * 1000);
            }
        }

        // Initialize Default Mode
        setMode('photo');
        togglePromptInput(); // Set initial state of prompt input

        // Listen for prompt changes
        promptInput.addEventListener('input', updateButtonStates);

        // Initial state check
        updateButtonStates();

        // Stop/Pause analysis based on video state
        video.addEventListener('ended', () => {
            if (isStreaming && currentMode === 'video') {
                console.log("Video ended, stopping analysis.");
                stopStream();
                updateActionButton();
            }
        });

        video.addEventListener('pause', () => {
            if (isStreaming && currentMode === 'video') {
                // Calculate remaining time
                const elapsed = Date.now() - lastAnalysisTimestamp;
                remainingTimeAtPause = (captureIntervalSec * 1000) - elapsed;
                if (remainingTimeAtPause < 0) remainingTimeAtPause = 0;

                console.log(`Video paused. Remaining time for next analysis: ${remainingTimeAtPause}ms`);

                if (streamTimeout) {
                    clearTimeout(streamTimeout);
                    streamTimeout = null;
                }
                updateActionButton();
                // Note: We do NOT cancelCurrentAnalysis() here so the last one can finish
            }
        });

        video.addEventListener('play', () => {
            if (isStreaming && currentMode === 'video' && !streamTimeout) {
                console.log(`Video resumed. Rescheduling analysis in ${remainingTimeAtPause}ms`);
                scheduleNextAnalysis(remainingTimeAtPause);
                updateActionButton();
            }
        });

    </script>

</body>

</html>
